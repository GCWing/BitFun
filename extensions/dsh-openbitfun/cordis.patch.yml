# dsh-openbitfun bundle patch: register the OpenBitFun SDK Host bridge in this profile.
# The row below carries neutral defaults; override it in the profile's own
# cordis.patch.yml when a custom host binary or tighter caps are needed, e.g.:
#
#   - id: openbitfun
#     config:
#       hostPath: '/absolute/path/to/openbitfun-sdk-host'
#       queryTimeoutMs: 1800000
#
- insert:
    - id: openbitfun
      name: 'dsh-openbitfun'
