name: Linux Binary Build

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Tag or commit SHA to build."
        required: true
        type: string
      version:
        description: "Release version used by binaries and archive metadata."
        required: true
        type: string
      artifact_prefix:
        description: "Stable prefix that isolates artifacts in the caller run."
        required: true
        type: string
    secrets:
      release_signing_key:
        description: "Tauri/minisign private key, base64. Absent on forks: archives ship unsigned."
        required: false
      release_signing_password:
        description: "Password for release_signing_key."
        required: false
      release_pubkey:
        description: "Tauri/minisign public key, base64. Compiled into the CLI as its trust root."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Linux Binaries (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            libssl-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            python3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "linux-binaries-v1-${{ matrix.platform.name }}"
          cache-bin: false

      - name: Patch build version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Strip SemVer build metadata (`+<sha>`): GitHub rewrites non-alphanumeric
          # characters in uploaded release asset names, so a `+` in a filename would
          # make every URL in linux-binaries.json a 404. Desktop packaging strips it
          # the same way, which also keeps the two asset sets on one version string.
          ASSET_VERSION="${RELEASE_VERSION%%+*}"
          echo "ASSET_VERSION=${ASSET_VERSION}" >>"$GITHUB_ENV"
          sed -i \
            "s/^version = \".*\" # x-release-please-version/version = \"${ASSET_VERSION}\" # x-release-please-version/" \
            Cargo.toml
          sed -i \
            "s/^version = \".*\" # x-release-please-version/version = \"${ASSET_VERSION}\" # x-release-please-version/" \
            src/apps/relay-server/Cargo.toml

      - name: Build CLI and Relay Server
        shell: bash
        env:
          # Compiled into the CLI; its presence makes signature verification
          # mandatory for self-update. Unset on forks, which then fall back to
          # checksum-only.
          BITFUN_RELEASE_PUBKEY: ${{ secrets.release_pubkey }}
        run: |
          cargo build --release \
            --target ${{ matrix.platform.target }} \
            -p bitfun-cli \
            -p bitfun-relay-server \
            --bins

      - name: Test CLI installer
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}
        run: bash scripts/cli/test-install-unix.sh "${{ matrix.platform.target }}"

      - name: Package CLI
        id: cli-stage
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: bash scripts/cli/package-unix.sh "$ASSET_VERSION" "$TARGET"

      - name: Package Relay Server
        id: relay-stage
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: bash scripts/relay/package-unix.sh "$ASSET_VERSION" "$TARGET"

      - name: Sign release archives
        id: sign
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.release_signing_key }}
          SIGNING_PASSWORD: ${{ secrets.release_signing_password }}
          SIGNING_PUBKEY: ${{ secrets.release_pubkey }}
          CLI_ARCHIVE: ${{ steps.cli-stage.outputs.archive }}
          RELAY_ARCHIVE: ${{ steps.relay-stage.outputs.archive }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "No release signing key configured; archives ship with checksums only."
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          sudo apt-get install -y --no-install-recommends minisign

          # Tauri stores the minisign secret key base64-wrapped; unwrap it to the
          # on-disk format minisign expects. Same key that signs Desktop updates,
          # so the CLI and the Desktop updater share one trust root.
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 -d >"$RUNNER_TEMP/release.key"
          printf '%s' "$SIGNING_PUBKEY" | base64 -d >"$RUNNER_TEMP/release.pub"

          for archive in "$CLI_ARCHIVE" "$RELAY_ARCHIVE"; do
            printf '%s\n' "$SIGNING_PASSWORD" |
              minisign -S -s "$RUNNER_TEMP/release.key" -m "$archive" -x "${archive}.minisig"
            # Verify before publishing: a signature nobody checked is worse than
            # none, because the client is about to treat it as proof.
            minisign -Vm "$archive" -p "$RUNNER_TEMP/release.pub" -x "${archive}.minisig"
            # Tauri's wire format is base64 of the whole signature file.
            base64 -w0 <"${archive}.minisig" >"${archive}.sig"
            rm -f "${archive}.minisig"
            echo "Signed and verified: ${archive}.sig"
          done

          rm -f "$RUNNER_TEMP/release.key" "$RUNNER_TEMP/release.pub"
          echo "signed=true" >>"$GITHUB_OUTPUT"

      - name: Upload Linux binary artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bitfun-linux-${{ inputs.artifact_prefix }}-${{ matrix.platform.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.cli-stage.outputs.archive }}
            ${{ steps.cli-stage.outputs.checksum }}
            ${{ steps.relay-stage.outputs.archive }}
            ${{ steps.relay-stage.outputs.checksum }}
            *.tar.gz.sig
