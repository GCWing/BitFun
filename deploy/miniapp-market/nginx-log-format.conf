# Install inside the Nginx `http` context (for example under
# `/etc/nginx/conf.d/`). It deliberately excludes client IPs, query strings,
# cookies, request bodies, and authorization headers.
log_format miniapp_market_json escape=json
  '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"requestTime":$request_time}';
