<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BitFun recovery</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #121214; color: #f2f2f5; }
      main { width: min(520px, calc(100vw - 48px)); padding: 32px; border: 1px solid #34343a; border-radius: 16px; background: #1b1b1f; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { margin: 0; color: #aaaab3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>BitFun frontend recovery</h1>
      <p>The external frontend bundle could not be loaded. Restart BitFun to restore the packaged revision. / 外置前端无法加载，请重启 BitFun 以恢复打包版本。</p>
    </main>
  </body>
</html>
