[package]
license.workspace = true
name = "bitfun-sdk-host-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Standalone local Agent SDK Host implementation candidate"
autobins = false

[[bin]]
name = "bitfun-sdk-host"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitfun-agent-runtime = { path = "../../crates/execution/agent-runtime" }
bitfun-core = { path = "../../crates/assembly/core", default-features = false, features = [
    "agent-runtime",
    "document-read",
    "subscription-auth",
    "deep-research",
    "lsp",
    "external-sources",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-miniapp",
    "tools-canvas",
    "tools-agent-control",
] }
bitfun-sdk-host = { path = "../../crates/interfaces/sdk-host" }
futures-util = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
