[package]
name = "openbitfun-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun Server - Web-based AI Code Assistant"

[[bin]]
name = "openbitfun-server"
path = "src/main.rs"

[dependencies]
openbitfun-core = { path = "../../crates/assembly/core", features = ["product-full"] }

# App-server surface: an in-process JSON-RPC server/client pair over an
# in-memory channel transport. The websocket handler routes agent kernel RPCs
# through this client so agent interfaces uniformly go through app-server.
openbitfun-app-server = { path = "../../crates/interfaces/app-server" }
openbitfun-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
openbitfun-events = { path = "../../crates/contracts/events" }

agent-client-protocol = { workspace = true }

# Web framework
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["cors"] }

# Inherited from workspace
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
