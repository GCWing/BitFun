<!doctype html>
<html lang="zh-CN" data-bf-design-system-root data-color-scheme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitFun Mobile Parity Bench</title>
    <link rel="stylesheet" href="/design-system-tokens.css" />
    <link rel="stylesheet" href="/design-system-theme.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main class="bench-shell">
      <header class="bench-header">
        <div>
          <p class="eyebrow">BITFUN MOBILE · NATIVE PARITY</p>
          <h1>三端视觉校准台</h1>
          <p class="intro">HarmonyOS 是基准。Android 与 iOS 使用同一契约、同一场景，各自保持原生渲染。</p>
        </div>
        <div class="baseline-key"><span></span> HarmonyOS baseline</div>
      </header>

      <section class="toolbar" aria-label="Preview controls">
        <label>
          <span>场景</span>
          <select id="scenario-select"></select>
        </label>
        <label>
          <span>外观</span>
          <select id="appearance-select">
            <option value="scenario">跟随场景</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <label class="range-control">
          <span>原生截图透明度</span>
          <input id="opacity-control" type="range" min="0" max="100" value="100" />
          <output id="opacity-output">100%</output>
        </label>
        <label class="check-control">
          <input id="grid-control" type="checkbox" />
          <span>显示 8pt 对齐网格</span>
        </label>
      </section>

      <section class="scenario-note" aria-live="polite">
        <strong id="scenario-title"></strong>
        <span id="scenario-description"></span>
      </section>

      <section id="platform-grid" class="platform-grid" aria-label="Native platform comparison"></section>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
