[package]
name = "openbitfun-miniapp-market-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun MiniApp marketplace HTTP server"

[[bin]]
name = "openbitfun-miniapp-market-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
openbitfun-miniapp-market-service = { path = "../../crates/services/miniapp-market-service" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints]
workspace = true
