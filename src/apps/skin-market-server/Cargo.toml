[package]
license.workspace = true
name = "bitfun-skin-market-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun appearance marketplace HTTP server"

[[bin]]
name = "bitfun-skin-market-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bitfun-skin-market-service = { path = "../../crates/services/skin-market-service" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints]
workspace = true
