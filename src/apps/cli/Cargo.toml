[package]
name = "bitfun-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun CLI - Terminal User Interface"
default-run = "bitfun"
autobins = false
autotests = false

[[bin]]
name = "bitfun"
path = "src/main.rs"

[[bin]]
name = "bitfun-cli"
path = "src/bin/bitfun_cli_compat.rs"

[[test]]
name = "acp_stdio_cli"
path = "tests/acp_stdio_cli.rs"

[[test]]
name = "app_server_stdio_cli"
path = "tests/app_server_stdio_cli.rs"

[[test]]
name = "cli_command_contracts"
path = "tests/cli_command_contracts.rs"

[[test]]
name = "terminal_process_contracts"
path = "tests/terminal_process_contracts.rs"

[dependencies]
# Internal crates
bitfun-core = { path = "../../crates/assembly/core", features = [
    "agent-runtime",
    "document-read",
    "subscription-auth",
    "remote-connect",
    "lsp",
    "external-sources",
    "plugin-runtime",
    "opencode-plugin-host",
    "ssh-remote",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-agent-control",
] }
bitfun-events = { path = "../../crates/contracts/events" }
bitfun-core-types = { path = "../../crates/contracts/core-types" }
bitfun-acp = { path = "../../crates/interfaces/acp", default-features = false, features = ["client", "server"] }
bitfun-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
bitfun-agent-runtime-ipc = { path = "../../crates/adapters/agent-runtime-ipc" }
bitfun-app-server = { path = "../../crates/interfaces/app-server" }
bitfun-runtime-ports = { path = "../../crates/contracts/runtime-ports", features = ["agent-api", "git-port", "permission", "plugin-runtime", "workspace-ports"] }
bitfun-runtime-services = { path = "../../crates/execution/runtime-services" }
bitfun-services-core = { path = "../../crates/services/services-core", features = ["dispatch-workspace", "local-storage", "process-runtime", "runtime-ownership"] }
bitfun-agent-tools = { path = "../../crates/execution/tool-contracts" }
bitfun-product-domains = { path = "../../crates/contracts/product-domains", features = ["external-sources"] }

# CLI framework
clap = { workspace = true }

# TUI framework (Terminal User Interface)
ratatui = { workspace = true }
crossterm = { workspace = true }

# Config and serialization
dirs = { workspace = true }
toml = { workspace = true }

# Session management
uuid = { workspace = true }
chrono = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Unicode width calculation (for correct wide-char handling)
unicode-width = { workspace = true }

# Path canonicalization without Windows UNC prefix
dunce = { workspace = true }

# Markdown parsing and rendering
pulldown-cmark = { workspace = true }

# Diff computation for tool card rendering
similar = { workspace = true }

# Syntax highlighting for code blocks and tool cards
syntect = { workspace = true }

# Lazy initialization for syntax highlighter singleton
once_cell = { workspace = true }

# Unix-only best-effort terminal color detection (OSC 11)
libc = { workspace = true }

# Clipboard access (for reliable paste on Windows where bracketed paste is broken)
arboard = { workspace = true }

# Inherited from workspace
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
fs2 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
minisign-verify = "0.2"
reqwest = { workspace = true, features = ["http2", "rustls", "stream"] }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
shlex = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }
winsplit = { workspace = true }

# portable-pty: ohos requires 0.9 (nix 0.25 is incompatible); all other
# platforms use 0.8 to avoid the PSEUDOCONSOLE_INHERIT_CURSOR ConPTY bug.
[target.'cfg(not(target_env = "ohos"))'.dev-dependencies]
portable-pty = { workspace = true }

[target.'cfg(target_env = "ohos")'.dev-dependencies]
portable-pty = "0.9"

[features]
default = []

[lints]
workspace = true
