<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/openbitfun-app-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/openbitfun-app-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/openbitfun-app-icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBitFun - AI Code Assistant</title>
    <script>
      (function () {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var root = document.documentElement;
        var fallbackMessages = {
          'en-US': {
            loadingApp: 'Starting OpenBitFun...',
            minimize: 'Minimize',
            maximize: 'Maximize',
            close: 'Close',
            petLoading: 'Loading companion...'
          },
          'zh-CN': {
            loadingApp: '正在启动 OpenBitFun...',
            minimize: '最小化',
            maximize: '最大化',
            close: '关闭',
            petLoading: '正在加载助手...'
          },
          'zh-TW': {
            loadingApp: '正在啟動 OpenBitFun...',
            minimize: '最小化',
            maximize: '最大化',
            close: '關閉',
            petLoading: '正在載入助手...'
          }
        };
        function resolveLocale() {
          var injected = window.__OPENBITFUN_BOOTSTRAP_LOCALE__;
          var lang = typeof injected === 'string' && injected ? injected : navigator.language;
          if (/^zh-(tw|hk|mo|hant)/i.test(lang)) return 'zh-TW';
          if (/^en/i.test(lang)) return 'en-US';
          return 'zh-CN';
        }
        function resolveMessages() {
          var locale = resolveLocale();
          var injected = window.__OPENBITFUN_BOOTSTRAP_MESSAGES__;
          return Object.assign({}, fallbackMessages[locale], injected || {});
        }
        window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__ = resolveMessages;
        window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__ = resolveLocale;
        window.__OPENBITFUN_STARTUP_OVERLAY_STARTED_AT__ = performance.now();
        root.setAttribute('lang', resolveLocale());
        root.setAttribute('data-openbitfun-design-system-root', '');
        if (!root.hasAttribute('data-color-scheme')) {
          root.setAttribute('data-color-scheme', m && m.matches ? 'dark' : 'light');
        }
        root.setAttribute('data-contrast', 'standard');
        root.setAttribute('data-density', 'compact');
        var bg = root.style.backgroundColor || 'var(--openbitfun-color-surface-chrome)';
        root.style.backgroundColor = bg;
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/design-system-theme.css" />
    <!-- OPENBITFUN_FONT_PROFILE_STYLESHEET -->
    <style>
      @layer openbitfun.tokens.system, openbitfun.tokens.theme, openbitfun.reset, openbitfun.base, openbitfun.components, openbitfun.overrides;

      @layer openbitfun.reset {
        *,
        *::before,
        *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      html {
        background-color: var(--openbitfun-color-surface-chrome);
      }
      
      body {
        background-color: inherit;
      }

      #root,
      #openbitfun-startup-overlay {
        width: 100%;
        height: 100%;
      }

      #openbitfun-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }

      .openbitfun-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .splash-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--openbitfun-color-surface-chrome);
        color: var(--openbitfun-color-content-muted);
        font-family: var(--openbitfun-font-family-sans);
        font-size: 13px;
        pointer-events: none;
      }

      #openbitfun-startup-overlay.openbitfun-startup-overlay--exiting {
        animation: openbitfun-startup-overlay-exit 0.24s ease-in-out both;
      }

      .openbitfun-startup-window-controls {
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 2px;
        opacity: 0.72;
        pointer-events: auto;
      }

      .openbitfun-startup-window-controls[hidden] {
        display: none;
      }

      .openbitfun-startup-window-controls__btn {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--openbitfun-color-content-muted);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .openbitfun-startup-window-controls__btn:hover {
        background: var(--openbitfun-color-action-quiet-hover);
        color: var(--openbitfun-color-content-primary);
      }

      .openbitfun-startup-window-controls__btn--close:hover {
        color: var(--openbitfun-color-status-danger-content);
      }

      .openbitfun-startup-window-controls__glyph {
        position: relative;
        width: 12px;
        height: 12px;
        display: block;
      }

      .openbitfun-startup-window-controls__glyph--minimize::before {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 6px;
        height: 1.5px;
        border-radius: 999px;
        background: currentColor;
      }

      .openbitfun-startup-window-controls__glyph--maximize::before {
        content: "";
        position: absolute;
        inset: 2px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
      }

      .openbitfun-startup-window-controls__glyph--close::before,
      .openbitfun-startup-window-controls__glyph--close::after {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        top: 5px;
        height: 1.5px;
        border-radius: 999px;
        background: currentColor;
      }

      .openbitfun-startup-window-controls__glyph--close::before {
        transform: rotate(45deg);
      }

      .openbitfun-startup-window-controls__glyph--close::after {
        transform: rotate(-45deg);
      }

      .splash-screen__center {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-screen__logo-wrap {
        animation: splash-logo-idle 3.2s ease-in-out infinite;
        -webkit-animation: splash-logo-idle 3.2s ease-in-out infinite;
        will-change: filter, opacity, transform;
      }

      .splash-screen__logo,
      .openbitfun-preload__logo {
        display: block;
        width: 96px;
        height: 96px;
        user-select: none;
        -webkit-user-select: none;
      }

      .openbitfun-preload__logo--light {
        display: none;
      }

      [data-color-scheme="dark"] .openbitfun-preload__logo--dark {
        display: none;
      }

      [data-color-scheme="dark"] .openbitfun-preload__logo--light {
        display: block;
      }

      .splash-screen__message {
        position: absolute;
        top: calc(100% + 16px);
        left: 50%;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        color: var(--openbitfun-color-content-muted);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -2px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        pointer-events: none;
      }

      .splash-screen__message--visible {
        opacity: 0.62;
        transform: translate(-50%, 0);
      }

      @keyframes splash-logo-idle {
        0%, 100% {
          opacity: 0.42;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes openbitfun-startup-overlay-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen__logo-wrap {
          animation: none;
        }

        .splash-screen__logo {
          filter: none;
        }

        .splash-screen__message {
          transition: none;
        }
      }

      .openbitfun-pet-preload-body {
        background: transparent !important;
      }

      .openbitfun-pet-preload-body #root {
        background: transparent;
      }

      .openbitfun-pet-preload {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .openbitfun-pet-preload__sprite {
        position: relative;
        width: 48px;
        height: 48px;
        transform-origin: center bottom;
        animation: openbitfun-pet-preload-breathe 1.8s ease-in-out infinite;
      }

      @keyframes openbitfun-pet-preload-breathe {
        0%, 100% {
          opacity: 0.58;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.92;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .openbitfun-pet-preload__sprite {
          animation: none;
        }
      }
    </style>
    <!-- Creative overrides are activated by the runtime after the shell renders. -->
  </head>

  <body>
    <script type="module" src="/src/main.tsx"></script>
    <div id="root"></div>
    <div id="openbitfun-startup-overlay">
      <div class="splash-screen">
        <div class="openbitfun-startup-window-controls" data-startup-window-controls hidden>
          <button class="openbitfun-startup-window-controls__btn" type="button" data-startup-window-action="minimize">
            <span class="openbitfun-startup-window-controls__glyph openbitfun-startup-window-controls__glyph--minimize" aria-hidden="true"></span>
          </button>
          <button class="openbitfun-startup-window-controls__btn" type="button" data-startup-window-action="toggle_maximize">
            <span class="openbitfun-startup-window-controls__glyph openbitfun-startup-window-controls__glyph--maximize" aria-hidden="true"></span>
          </button>
          <button class="openbitfun-startup-window-controls__btn openbitfun-startup-window-controls__btn--close" type="button" data-startup-window-action="close">
            <span class="openbitfun-startup-window-controls__glyph openbitfun-startup-window-controls__glyph--close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="splash-screen__center">
          <div class="splash-screen__logo-wrap">
            <img
              src="/brand/openbitfun-mark-dark-128.png"
              class="openbitfun-preload__logo openbitfun-preload__logo--dark"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="low"
            />
            <img
              class="openbitfun-preload__logo openbitfun-preload__logo--light"
              src="/brand/openbitfun-mark-light-128.png"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="low"
            />
          </div>
          <div class="splash-screen__message">Starting OpenBitFun...</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isPetWindow = params.get('openbitfunWindow') === 'agent-companion';
        var messages = window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__
          ? window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__()
          : { loadingApp: 'Starting OpenBitFun...', minimize: 'Minimize', maximize: 'Maximize', close: 'Close', petLoading: 'Loading companion...' };
        var locale = window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__
          ? window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__()
          : 'en-US';
        document.documentElement.setAttribute('lang', locale);

        if (isPetWindow) {
          document.body.classList.add('openbitfun-pet-preload-body');
          var startupOverlay = document.getElementById('openbitfun-startup-overlay');
          if (startupOverlay) startupOverlay.remove();
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div class="openbitfun-pet-preload"><div class="openbitfun-pet-preload__sprite" aria-hidden="true"></div><span class="openbitfun-sr-only"></span></div>';
            var petStatus = root.querySelector('.openbitfun-sr-only');
            if (petStatus) petStatus.textContent = messages.petLoading;
          }
          return;
        }

        var hint = document.querySelector('.splash-screen__message');
        if (hint) {
          hint.textContent = messages.loadingApp;
          window.setTimeout(function () {
            hint.classList.add('splash-screen__message--visible');
          }, 1200);
        }

        var controls = document.querySelector('[data-startup-window-controls]');
        if (controls && window.__OPENBITFUN_SHOW_STARTUP_WINDOW_CONTROLS__) {
          controls.hidden = false;
          var labels = {
            minimize: messages.minimize,
            toggle_maximize: messages.maximize,
            close: messages.close
          };
          controls.querySelectorAll('[data-startup-window-action]').forEach(function (button) {
            var action = button.getAttribute('data-startup-window-action');
            var label = labels[action] || action;
            button.setAttribute('aria-label', label);
            button.setAttribute('title', label);
            button.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              var tauri = window.__TAURI_INTERNALS__;
              if (!tauri || typeof tauri.invoke !== 'function') return;
              tauri.invoke('startup_window_control', { request: { action: action } }).catch(function () {});
            });
          });
        }
      })();
    </script>
  </body>
</html>
