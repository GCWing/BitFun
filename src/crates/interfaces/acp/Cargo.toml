[package]
license.workspace = true
name = "bitfun-acp"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun Agent Client Protocol surface"

[lib]
name = "bitfun_acp"

[dependencies]
bitfun-core = { path = "../../assembly/core", default-features = false, features = [
    "agent-runtime",
    "deep-research",
    "lsp",
    "external-sources",
    "ssh-remote",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-miniapp",
    "tools-canvas",
    "tools-agent-control",
] }
bitfun-agent-runtime = { path = "../../execution/agent-runtime" }
bitfun-agent-tools = { path = "../../execution/tool-contracts" }
bitfun-events = { path = "../../contracts/events" }
bitfun-core-types = { path = "../../contracts/core-types" }

agent-client-protocol = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
