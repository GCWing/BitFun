[package]
name = "bitfun-services-integrations"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun integration service owner crate"

[lib]
name = "bitfun_services_integrations"
crate-type = ["rlib"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
bitfun-agent-runtime = { path = "../../execution/agent-runtime", optional = true }
bitfun-agent-tools = { path = "../../execution/tool-contracts", optional = true }
bitfun-events = { path = "../../contracts/events" }
bitfun-core-types = { path = "../../contracts/core-types", optional = true }
bitfun-product-domains = { path = "../../contracts/product-domains", default-features = false, optional = true }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", optional = true }
aes-gcm = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bitfun-services-core = { path = "../services-core", default-features = false, optional = true }
bzip2 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
image = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
minisign-verify = { version = "0.2", optional = true }
libc = { workspace = true, optional = true }
local-ip-address = { workspace = true, optional = true }
mac_address = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
oxc = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = { workspace = true, optional = true }
sherpa-onnx = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
url = { workspace = true, optional = true }
which = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
russh-keys = { workspace = true, optional = true }
shellexpand = { workspace = true, optional = true }
ssh_config = { workspace = true, optional = true }
terminal-core = { path = "../terminal", optional = true }
x25519-dalek = { workspace = true, optional = true }

[target.'cfg(not(windows))'.dependencies]
git2 = { workspace = true, features = ["vendored-openssl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
schannel = { version = "0.1", optional = true }
windows-native-keyring-store = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[features]
default = []
announcement = ["reqwest", "tokio/fs", "tokio/sync"]
browser-control = ["anyhow", "bitfun-services-core/process-runtime", "dirs", "reqwest", "thiserror", "tokio/time"]
canvas-runtime = [
    "dep:bitfun-product-domains",
    "oxc",
    "sha2",
    "tokio/fs",
    "urlencoding",
    "uuid",
]
debug-log = ["anyhow", "chrono", "reqwest", "tokio/rt", "uuid"]
deep-research = ["bitfun-agent-runtime", "tokio/fs"]
git = [
    "async-trait",
    "bitfun-runtime-ports",
    "bitfun-services-core/process-runtime",
    "chrono",
    "git2",
    "thiserror",
    "tokio/fs",
