[package]
name = "openbitfun-skin-market-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun appearance marketplace service"

[lib]
name = "openbitfun_skin_market_service"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
openbitfun-product-domains = { path = "../../contracts/product-domains", features = ["appearance-market"] }
openbitfun-services-core = { path = "../services-core", features = ["tls-provider"] }
chrono = { workspace = true }
hex = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
hmac = { workspace = true }
reqwest = { workspace = true, features = ["http2", "json", "rustls-no-provider"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
