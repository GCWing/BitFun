[package]
name = "bitfun-services-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun core service owner crate"
autotests = false

[lib]
name = "bitfun_services_core"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bitfun-core-types = { path = "../../contracts/core-types", optional = true }
bitfun-events = { path = "../../contracts/events", optional = true }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
fs2 = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
which = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

# Keep libgit2 self-contained on Unix, matching the product assembly dependency.
[target.'cfg(not(windows))'.dependencies]
git2 = { workspace = true, features = ["vendored-openssl"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[features]
default = []
diagnostics = ["dep:regex"]
diff = ["dep:similar", "dep:tokio", "tokio/rt", "tokio/time"]
filesystem = [
    "dep:base64",
    "dep:chrono",
    "dep:ignore",
    "dep:regex",
    "dep:sha2",
    "dep:tokio",
    "tokio/fs",
    "tokio/rt",
]
json-io = [
    "dep:fs2",
    "dep:tokio",
    "dep:windows",
    "tokio/fs",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "windows/Win32_Foundation",
    "windows/Win32_Storage_FileSystem",
]
local-storage = [
    "dep:bitfun-core-types",
    "dep:bitfun-events",
    "dep:chrono",
    "dep:chrono-tz",
    "dep:fs2",
    "dep:libc",
    "dep:regex",
    "dep:sha2",
    "dep:similar",
    "dep:tokio",
    "dep:windows",
    "tokio/fs",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "windows/Win32_Foundation",
    "windows/Win32_Storage_FileSystem",
]
process-runtime = [
    "dep:libc",
    "dep:tokio",
    "dep:which",
    "dep:win32job",
    "dep:windows",
    "tokio/io-util",
    "tokio/process",
    "tokio/rt",
    "tokio/time",
    "windows/Win32_Foundation",
    "windows/Win32_System_Diagnostics_ToolHelp",
    "windows/Win32_System_Threading",
]
workspace-instructions = [
    "dep:globset",
    "dep:regex",
    "dep:serde_yaml",
    "dep:tokio",
    "tokio/fs",
    "tokio/io-util",
    "tokio/rt",
]
lsp = [
    "dep:anyhow",
    "dep:bitfun-core-types",
    "dep:notify",
    "dep:zip",
    "process-runtime",
    "tokio/fs",
    "tokio/io-util",
    "tokio/sync",
]
markdown = ["dep:regex", "dep:serde_yaml"]
workspace-runtime = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:bitfun-runtime-ports",
    "bitfun-runtime-ports/runtime-event-port",
    "bitfun-runtime-ports/workspace-ports",
    "dep:dunce",
    "process-runtime",
    "tokio/fs",
    "tokio/io-util",
    "tokio/sync",
]
workspace-identity = ["dep:dunce", "dep:sha2"]
runtime-ownership = ["dep:dunce", "dep:fs2", "dep:sha2"]
permission = [
    "dep:async-trait",
    "dep:bitfun-runtime-ports",
    "dep:rusqlite",
    "dep:tokio",
    "bitfun-runtime-ports/permission",
    "tokio/rt",
]
dispatch-workspace = ["dep:anyhow", "dep:sha2"]
session-git = ["local-storage", "dep:git2"]
workspace-text-runtime = ["dep:tokio", "tokio/rt"]

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[[test]]
name = "markdown_owner_contracts"
path = "tests/markdown_owner_contracts.rs"
required-features = ["markdown"]

[[test]]
name = "declarative_workspace_instruction_contracts"
path = "tests/declarative_workspace_instruction_contracts.rs"
required-features = ["workspace-instructions"]

[[test]]
name = "lsp_plugin_registry_contracts"
path = "tests/lsp_plugin_registry_contracts.rs"
required-features = ["lsp"]

[[test]]
name = "runtime_ownership_contracts"
path = "tests/runtime_ownership_contracts.rs"
required-features = ["runtime-ownership"]

[[test]]
name = "local_runtime_ports"
path = "tests/local_runtime_ports.rs"
required-features = ["workspace-runtime"]

[[test]]
name = "permission_store_contracts"
path = "tests/permission_store_contracts.rs"
required-features = ["permission"]

[[test]]
name = "workspace_instruction_contracts"
path = "tests/workspace_instruction_contracts.rs"
required-features = ["workspace-instructions", "workspace-runtime"]

[[test]]
name = "session_write_lock_contracts"
path = "tests/session_write_lock_contracts.rs"
required-features = ["local-storage"]

[[test]]
name = "process_runtime_contracts"
path = "tests/process_runtime_contracts.rs"
required-features = ["process-runtime"]

[[test]]
name = "service_contracts"
path = "tests/service_contracts.rs"

[[test]]
name = "storage_owner_contracts"
path = "tests/storage_owner_contracts.rs"
required-features = ["local-storage"]

[[test]]
name = "session_contracts"
path = "tests/session_contracts.rs"
required-features = ["local-storage"]

[[test]]
name = "session_usage_contracts"
path = "tests/session_usage_contracts.rs"
required-features = ["local-storage"]

[lints]
workspace = true
