[package]
name = "bitfun-services-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun core service owner crate"

[lib]
name = "bitfun_services_core"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bitfun-core-types = { path = "../../contracts/core-types" }
bitfun-events = { path = "../../contracts/events" }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
fs2 = { workspace = true }
notify = { workspace = true, optional = true }
ignore = { workspace = true }
globset = { workspace = true }
sha2 = { workspace = true }
which = { workspace = true }
similar = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Keep libgit2 self-contained on Unix, matching the product assembly dependency.
[target.'cfg(not(windows))'.dependencies]
git2 = { workspace = true, features = ["vendored-openssl"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
lsp = ["dep:anyhow", "dep:notify", "dep:zip"]
markdown = ["dep:serde_yaml"]
workspace-runtime = ["dep:anyhow", "dep:async-trait", "dep:bitfun-runtime-ports", "dep:dunce"]
workspace-identity = ["dep:dunce"]
runtime-ownership = ["dep:dunce"]
permission = ["dep:async-trait", "dep:bitfun-runtime-ports", "dep:rusqlite", "bitfun-runtime-ports/permission"]
dispatch-workspace = ["dep:anyhow"]
session-git = ["dep:git2"]

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "markdown_owner_contracts"
required-features = ["markdown"]

[[test]]
name = "lsp_plugin_registry_contracts"
required-features = ["lsp"]

[[test]]
name = "runtime_ownership_contracts"
required-features = ["runtime-ownership"]

[[test]]
name = "local_runtime_ports"
required-features = ["workspace-runtime"]

[[test]]
name = "permission_store_contracts"
required-features = ["permission"]

[[test]]
name = "workspace_instruction_contracts"
required-features = ["workspace-runtime"]

[[test]]
name = "session_write_lock_contracts"

[lints]
workspace = true
