[package]
name = "bitfun-miniapp-market-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun MiniApp marketplace service"

[lib]
name = "bitfun_miniapp_market_service"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bitfun-product-domains = { path = "../../contracts/product-domains", features = ["miniapp"] }
chrono = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header", "trace"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
