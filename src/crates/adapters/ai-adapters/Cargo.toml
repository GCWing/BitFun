[package]
name = "bitfun-ai-adapters"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Shared AI protocol adapters for BitFun core and installer"
autotests = false

[lib]
name = "bitfun_ai_adapters"
crate-type = ["rlib"]

[[test]]
name = "ai_protocol_contracts"
path = "tests/ai_protocol_contracts.rs"

[[test]]
name = "ai_stream_contracts"
path = "tests/ai_stream_contracts.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
bitfun-agent-stream = { path = "../../execution/agent-stream" }
bitfun-core-types = { path = "../../contracts/core-types" }
bitfun-services-core = { path = "../../services/services-core", features = ["tls-provider"] }
chrono = { workspace = true }
dirs = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["http2", "json", "rustls-no-provider", "socks", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[features]
subscription-auth = [
    "dep:apple-native-keyring-store",
    "dep:base64",
    "bitfun-services-core/process-runtime",
    "dep:dirs",
    "dep:fs2",
    "dep:keyring-core",
    "dep:libc",
    "reqwest/form",
    "tokio/fs",
    "tokio/io-util",
    "tokio/net",
    "dep:uuid",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dev-dependencies]
axum = { workspace = true }
bitfun-events = { path = "../../contracts/events" }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[lints]
workspace = true
