[package]
name = "bitfun-agent-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Agent runtime contracts and owner decisions for BitFun"

[lib]
name = "bitfun_agent_runtime"
crate-type = ["rlib"]

[features]
default = ["taiji"]
taiji = [
    "bitfun-agent-tools/taiji",
    "bitfun-runtime-ports/taiji",
    "bitfun-services-core/taiji",
]

[dependencies]
async-trait = { workspace = true }
bitfun-agent-stream = { path = "../agent-stream" }
bitfun-agent-tools = { path = "../tool-contracts" }
bitfun-core-types = { path = "../../contracts/core-types" }
bitfun-events = { path = "../../contracts/events" }
bitfun-harness = { path = "../harness" }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission"] }
bitfun-runtime-services = { path = "../runtime-services" }
bitfun-services-core = { path = "../../services/services-core" }
dashmap = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
