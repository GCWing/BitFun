[package]
name = "bitfun-plugin-runtime-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Default PluginRuntimeClient implementation for BitFun extension execution"

[lib]
name = "bitfun_plugin_runtime_client"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", default-features = false, features = ["plugin-runtime"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
