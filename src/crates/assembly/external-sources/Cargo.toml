[package]
name = "bitfun-external-sources"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Ecosystem-neutral external source lifecycle coordination"

[lib]
name = "bitfun_external_sources"
crate-type = ["rlib"]

[dependencies]
bitfun-product-domains = { path = "../../contracts/product-domains", default-features = false, features = ["external-sources"] }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
