[package]
name = "openbitfun-external-sources"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Ecosystem-neutral external source lifecycle coordination"
autotests = false

[lib]
name = "openbitfun_external_sources"
crate-type = ["rlib"]

[dependencies]
openbitfun-product-domains = { path = "../../contracts/product-domains", features = ["external-sources"] }
futures = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "external_source_coordination_contracts"
path = "tests/external_source_coordination_contracts.rs"

[lints]
workspace = true
