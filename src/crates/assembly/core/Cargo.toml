[package]
license.workspace = true
name = "bitfun-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun Core Library - Platform-agnostic business logic"

[lib]
name = "bitfun_core"
crate-type = ["rlib"]

[dependencies]
# Inherit shared dependencies from workspace
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

log = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
regex = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
hex = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
dashmap = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

# Debug Log HTTP Server
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

notify = { workspace = true, optional = true }
dirs = { workspace = true }
dunce = { workspace = true }
filetime = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }

# Command detection (cross-platform)
similar = { workspace = true, optional = true }

# Shared AI protocol adapters
bitfun-ai-adapters = { path = "../../adapters/ai-adapters", optional = true }

# Lightweight agent stream processing
bitfun-agent-stream = { path = "../../execution/agent-stream", optional = true }

# Immutable built-in Agent prompt content
bitfun-agent-content = { path = "../agent-content", optional = true }

# Agent runtime owner contracts
bitfun-agent-runtime = { path = "../../execution/agent-runtime", optional = true }

# Harness workflow contracts
bitfun-harness = { path = "../../execution/harness", optional = true }

# Product capability pack contracts
bitfun-product-capabilities = { path = "../product-capabilities", default-features = false, optional = true }

# Ecosystem-neutral external source lifecycle coordinator
bitfun-external-sources = { path = "../external-sources", optional = true }

# Agent tool contracts
bitfun-agent-tools = { path = "../../execution/tool-contracts" }

# Tool pack provider plan
bitfun-tool-packs = { path = "../../execution/tool-provider-groups", default-features = false, optional = true }

# Core service owner crate
bitfun-services-core = { path = "../../services/services-core", default-features = false, features = ["json-io"] }

# Integration service owner crate
bitfun-services-integrations = { path = "../../services/services-integrations", default-features = false, optional = true }

# Product domain owner crate
bitfun-product-domains = { path = "../../contracts/product-domains", default-features = false, optional = true }

# Tool runtime
tool-runtime = { path = "../../execution/tool-execution", default-features = false, optional = true }

# terminal
terminal-core = { path = "../../services/terminal", optional = true }

# I18n internationalization
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

sha2 = { workspace = true }
rand = { workspace = true, optional = true }

# QR code generation

# WebSocket client
tokio-tungstenite = { workspace = true, optional = true }

# Event layer dependency (lowest layer)
bitfun-core-types = { path = "../../contracts/core-types" }
bitfun-events = { path = "../../contracts/events" }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission"] }
bitfun-runtime-services = { path = "../../execution/runtime-services", optional = true }

# Reviewed product-full plugin composition root.
bitfun-opencode-adapter = { path = "../../adapters/opencode-adapter", optional = true }
bitfun-claude-code-adapter = { path = "../../adapters/claude-code-adapter", optional = true }
bitfun-codex-adapter = { path = "../../adapters/codex-adapter", optional = true }
bitfun-plugin-runtime-client = { path = "../../execution/plugin-runtime-client", optional = true }

# Transport layer dependency
bitfun-transport = { path = "../../adapters/transport" }

[features]
# Full product runtime compatibility set. Product entrypoints with a narrower
# construction path select stable owner features instead of inheriting this
# union.
default = ["product-full"]
# Derive `ts_rs::TS` on selected wire types (e.g. `AgentProfileView`) for
# downstream TypeScript binding export. Propagates `ts` to the upstream crates
# whose types core re-exports (git types live in `services-integrations`,
# permission/session types in `runtime-ports`/`product-domains`). Weak feature
# references add the TS derives only when their optional dependencies are
# already enabled by an owning capability, so `ts` stays orthogonal to the
# product matrix. The other two upstream crates are non-optional and propagate
# their `ts` features directly.
ts = [
    "dep:ts-rs",
    "bitfun-core-types/ts",
    "bitfun-services-integrations?/ts",
    "bitfun-product-domains?/ts",
    "bitfun-runtime-ports/ts",
]
product-full = [
    "agent-runtime",
    "document-read",
    "subscription-auth",
    "model-catalog",
    "mcp-runtime",
    "remote-connect",
    "workspace-search",
    "browser-control",
    "web-tools",
    "deep-research",
    "scheduled-jobs",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-miniapp",
    "tools-canvas",
    "tools-agent-control",
    "function-agents",
    "canvas-runtime",
    "external-sources",
    "plugin-runtime",
    "debug-log",
    "announcement",
    "file-watch",
    "workspace-watch",
    "ssh-remote",
    "dispatch-store",
    "filesystem",
    "git",
    "lsp",
    "local-storage",
    "process-runtime",
    "remote-workspace",
    "review-platform",
    "terminal",
    "workspace-runtime",
    "product-capabilities",
    "runtime-services",
    "tool-packs",
    "warden-poke",
]
# Warden Challenge-Poke scheduling (Poisson scheduler) is part of the
# agentic runtime core: the Warden runtime is embedded in the scheduler
# and tool pipeline and compiles unconditionally under agent-runtime, so
# rand is owned by the agent-runtime feature (like md5/similar/rusqlite).
# warden-poke remains as a stable empty alias for product assemblies that
# reference it; it has no functional effect.
warden-poke = []
# Core compatibility facade and concrete product Agent Runtime assembly. This
# owns the existing agent/session/tool lifecycle, not app presentation or
# external ecosystem discovery.
agent-runtime = [
    "ai-adapter-runtime",
    "dep:bitfun-agent-runtime",
    "dep:bitfun-agent-content",
    "dep:bitfun-agent-stream",
    "dep:bitfun-harness",
    "dep:dashmap",
    "dep:filetime",
    "dep:flate2",
    "dep:fs2",
    "dep:include_dir",
    "dep:indexmap",
    "dep:image",
    "dep:md5",
    # Warden Challenge-Poke Poisson scheduling compiles unconditionally under
    # agent-runtime and needs rand (customization: upstream moved rand to
    # services-integrations, but core warden keeps it owned by agent-runtime).
    "dep:rand",
    "dep:rusqlite",
    "dep:similar",
    "dep:tool-runtime",
    "bitfun-services-core/permission",
    "bitfun-services-core/runtime-ownership",
    "bitfun-services-core/session-git",
    "filesystem",
    "local-storage",
    "process-runtime",
    "terminal",
    "workspace-runtime",
    "product-capabilities",
    "dep:bitfun-product-domains",
    "bitfun-product-domains/external-sources",
    "runtime-services",
    "tool-packs",
    "tools-basic",
    "tools-agent-control",
]
external-sources = [
    "agent-runtime",
    "model-catalog",
    "mcp-runtime",
    "script-tool-runtime",
    "dep:bitfun-opencode-adapter",
    "dep:bitfun-claude-code-adapter",
    "dep:bitfun-codex-adapter",
    "dep:bitfun-external-sources",
    "bitfun-services-integrations/hook-import",
    "plugin-source",
    "file-watch",
    "workspace-watch",
]

# Concrete service capabilities are selected independently from the portable
# Agent lifecycle. Product entrypoints compose only the owners they expose.
model-catalog = [
    "ai-adapter-runtime",
    "bitfun-services-integrations/models-dev",
    "runtime-services",
]
mcp-runtime = [
    "agent-runtime",
    "dep:axum",
    "dep:reqwest",
    "bitfun-services-integrations/mcp",
    "tokio/rt-multi-thread",
]
remote-connect = [
    "agent-runtime",
    "git",
    "model-catalog",
    "bitfun-services-integrations/remote-connect",
]
workspace-search = [
    "workspace-runtime",
    "bitfun-services-integrations/workspace-search",
]
browser-control = [
    "dep:tokio-tungstenite",
    "bitfun-services-integrations/browser-control",
]
web-tools = [
    "bitfun-services-integrations/web-tools",
    "tool-runtime/web-readable",
]
deep-research = ["bitfun-services-integrations/deep-research"]
script-tool-runtime = ["bitfun-services-integrations/script-tool-runtime"]
scheduled-jobs = [
    "dep:chrono-tz",
    "dep:cron",
]
# Additive dependency modifiers. Weak dependency feature references preserve
# the owning runtime boundary instead of activating that runtime by themselves.
document-read = ["tool-runtime?/document-read"]
subscription-auth = ["bitfun-ai-adapters?/subscription-auth"]

# Tool groups mirror the provider-neutral groups in bitfun-tool-packs. They
# compose concrete service owners but never form a product-shaped umbrella.
tools-basic = [
    "bitfun-tool-packs/basic",
    "workspace-search",
]
tools-git = [
    "bitfun-tool-packs/git",
    "git",
    "review-platform",
]
tools-mcp = [
    "bitfun-tool-packs/mcp",
    "mcp-runtime",
]
tools-browser-web = [
    "bitfun-tool-packs/browser-web",
    "browser-control",
    "web-tools",
]
tools-computer-use = [
    "bitfun-tool-packs/computer-use",
]
tools-image-analysis = [
    "bitfun-tool-packs/image-analysis",
]
tools-miniapp = [
    "bitfun-tool-packs/miniapp",
    "dep:bitfun-product-domains",
    "bitfun-product-domains/appearance-market",
    "bitfun-product-domains/miniapp",
    "bitfun-services-integrations/miniapp-runtime",
    "bitfun-services-integrations/miniapp-market",
    "runtime-services",
    "dep:reqwest",
    "dep:semver",
]
tools-canvas = [
    "bitfun-tool-packs/canvas",
    "canvas-runtime",
]
tools-agent-control = [
    "bitfun-tool-packs/agent-control",
    "scheduled-jobs",
]
plugin-runtime = [
    "external-sources",
    "dep:bitfun-plugin-runtime-client",
]
debug-log = [
    "dep:axum",
    "dep:tower-http",
    "bitfun-services-integrations/debug-log",
]
ai-adapter-runtime = [
    "dep:bitfun-ai-adapters",
]
product-capabilities = ["dep:bitfun-product-capabilities"]
plugin-source = [
    "dep:bitfun-product-domains",
    "bitfun-product-domains/plugin-source",
    "bitfun-services-integrations/plugin-source",
]
function-agents = [
    "ai-adapter-runtime",
    "dep:bitfun-product-domains",
    "bitfun-product-domains/function-agents",
    "bitfun-services-integrations/function-agents",
    "runtime-services",
]
canvas-runtime = [
    "dep:bitfun-product-domains",
    "bitfun-services-integrations/canvas-runtime",
]
runtime-services = ["dep:bitfun-runtime-services"]
announcement = ["bitfun-services-integrations/announcement"]
file-watch = ["bitfun-services-integrations/file-watch"]
git = ["bitfun-services-integrations/git"]
review-platform = ["bitfun-services-integrations/review-platform"]
service-integrations = ["announcement", "file-watch", "git", "review-platform"]
dispatch-store = ["local-storage", "bitfun-services-core/dispatch-workspace"]
filesystem = ["bitfun-services-core/filesystem"]
local-storage = ["bitfun-services-core/local-storage"]
process-runtime = ["bitfun-services-core/process-runtime"]
lsp = ["dep:notify", "bitfun-services-core/lsp"]
terminal = ["dep:terminal-core"]
workspace-runtime = [
    "dep:serde_yaml",
    "filesystem",
    "local-storage",
    "process-runtime",
    "bitfun-services-core/markdown",
    "bitfun-services-core/workspace-identity",
    "bitfun-services-core/workspace-instructions",
    "bitfun-services-core/workspace-runtime",
]
workspace-watch = ["workspace-runtime", "dep:notify"]
remote-workspace = [
    "workspace-runtime",
    "dep:bitfun-services-integrations",
    "bitfun-services-integrations/remote-ssh",
]
tool-packs = ["dep:bitfun-tool-packs"]
# Deprecated compatibility feature. Tauri integration is desktop-owned now;
# keep the public feature name as a no-op for downstream manifests.
tauri-support = []
ssh-remote = [
    "remote-workspace",
    "bitfun-services-integrations/remote-ssh-concrete",
]

[dev-dependencies]
bitfun-runtime-services = { path = "../../execution/runtime-services", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "git_contracts"
required-features = ["git"]

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
