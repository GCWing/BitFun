[package]
name = "bitfun-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "BitFun Core Library - Platform-agnostic business logic"

[lib]
name = "bitfun_core"
crate-type = ["rlib"]

[dependencies]
# Inherit shared dependencies from workspace
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

log = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
regex = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
hex = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
dashmap = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true }

# Debug Log HTTP Server
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

notify = { workspace = true, optional = true }
dirs = { workspace = true }
dunce = { workspace = true }
filetime = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }

# Command detection (cross-platform)
similar = { workspace = true, optional = true }
urlencoding = { workspace = true }

# Shared AI protocol adapters
bitfun-ai-adapters = { path = "../../adapters/ai-adapters", optional = true }

# Lightweight agent stream processing
bitfun-agent-stream = { path = "../../execution/agent-stream", optional = true }

# Immutable built-in Agent prompt content
bitfun-agent-content = { path = "../agent-content", optional = true }

# Agent runtime owner contracts
bitfun-agent-runtime = { path = "../../execution/agent-runtime", optional = true }

# Harness workflow contracts
bitfun-harness = { path = "../../execution/harness", optional = true }

# Product capability pack contracts
bitfun-product-capabilities = { path = "../product-capabilities", default-features = false, optional = true }

# Ecosystem-neutral external source lifecycle coordinator
bitfun-external-sources = { path = "../external-sources", optional = true }

# Agent tool contracts
bitfun-agent-tools = { path = "../../execution/tool-contracts" }

# Tool pack provider plan
bitfun-tool-packs = { path = "../../execution/tool-provider-groups", default-features = false, optional = true }

# Core service owner crate
bitfun-services-core = { path = "../../services/services-core", default-features = false }

# Integration service owner crate
bitfun-services-integrations = { path = "../../services/services-integrations", default-features = false, optional = true }

# Product domain owner crate
bitfun-product-domains = { path = "../../contracts/product-domains", default-features = false, optional = true }

# Tool runtime
tool-runtime = { path = "../../execution/tool-execution", default-features = false, optional = true, features = [
    "web-readable",
] }

# terminal
terminal-core = { path = "../../services/terminal", optional = true }

# I18n internationalization
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

sha2 = { workspace = true }

# QR code generation

# WebSocket client
tokio-tungstenite = { workspace = true, optional = true }

# Event layer dependency (lowest layer)
bitfun-core-types = { path = "../../contracts/core-types" }
bitfun-events = { path = "../../contracts/events" }
bitfun-runtime-ports = { path = "../../contracts/runtime-ports", features = ["permission"] }
bitfun-runtime-services = { path = "../../execution/runtime-services", optional = true }

# Reviewed product-full plugin composition root.
bitfun-opencode-adapter = { path = "../../adapters/opencode-adapter", optional = true }
bitfun-claude-code-adapter = { path = "../../adapters/claude-code-adapter", optional = true }
bitfun-codex-adapter = { path = "../../adapters/codex-adapter", optional = true }
bitfun-plugin-runtime-client = { path = "../../execution/plugin-runtime-client", optional = true }

# Transport layer dependency
bitfun-transport = { path = "../../adapters/transport" }

[features]
# Full product runtime feature set. Product crates should depend on this
# explicitly before `bitfun-core` default features are made lighter.
default = ["product-full"]
product-full = [
    "ai-adapter-runtime",
    "canvas-runtime",
    "dep:axum",
    "dep:bitfun-agent-runtime",
    "dep:bitfun-agent-content",
    "dep:bitfun-agent-stream",
    "dep:bitfun-harness",
    "dep:chrono-tz",
    "dep:cron",
    "dep:dashmap",
    "dep:filetime",
    "dep:flate2",
    "dep:fs2",
    "dep:include_dir",
    "dep:bitfun-opencode-adapter",
    "dep:bitfun-claude-code-adapter",
    "dep:bitfun-codex-adapter",
    "dep:bitfun-external-sources",
    "dep:bitfun-plugin-runtime-client",
    "dep:indexmap",
    "dep:image",
    "dep:md5",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:similar",
    "dep:tokio-tungstenite",
    "dep:tower-http",
    "dep:tool-runtime",
    "bitfun-services-integrations/product-full",
    "bitfun-services-core/dispatch-workspace",
    "bitfun-services-core/permission",
    "bitfun-services-core/runtime-ownership",
    "bitfun-services-core/session-git",
    "dispatch-store",
    "filesystem",
    "lsp",
    "local-storage",
    "process-runtime",
    "remote-workspace",
    "terminal",
    "workspace-runtime",
    "workspace-watch",
    "ssh-remote",
    "product-capabilities",
    "product-domains",
    "runtime-services",
    "announcement",
    "file-watch",
    "git",
    "review-platform",
    "tool-packs",
]
ai-adapter-runtime = [
    "dep:bitfun-ai-adapters",
    "bitfun-ai-adapters/subscription-auth",
    "dep:reqwest",
]
product-capabilities = ["dep:bitfun-product-capabilities"]
plugin-source = [
    "bitfun-services-integrations/plugin-source",
]
product-domains = [
    "ai-adapter-runtime",
    "dep:bitfun-product-domains",
    "plugin-source",
    "bitfun-services-integrations/function-agents",
    "bitfun-services-integrations/miniapp-runtime",
    "bitfun-services-integrations/miniapp-market",
    "bitfun-product-domains/product-full",
    "runtime-services",
]
canvas-runtime = [
    "product-domains",
    "bitfun-services-integrations/canvas-runtime",
]
runtime-services = ["dep:bitfun-runtime-services"]
announcement = ["bitfun-services-integrations/announcement"]
file-watch = ["bitfun-services-integrations/file-watch"]
git = ["bitfun-services-integrations/git"]
review-platform = ["bitfun-services-integrations/review-platform"]
service-integrations = ["announcement", "file-watch", "git", "review-platform"]
dispatch-store = ["local-storage"]
filesystem = ["bitfun-services-core/filesystem"]
local-storage = ["bitfun-services-core/local-storage"]
process-runtime = ["bitfun-services-core/process-runtime"]
lsp = ["dep:notify", "bitfun-services-core/lsp"]
terminal = ["dep:terminal-core"]
workspace-runtime = [
    "dep:serde_yaml",
    "filesystem",
    "local-storage",
    "process-runtime",
    "bitfun-services-core/markdown",
    "bitfun-services-core/workspace-identity",
    "bitfun-services-core/workspace-instructions",
    "bitfun-services-core/workspace-runtime",
]
workspace-watch = ["workspace-runtime", "dep:notify"]
remote-workspace = [
    "workspace-runtime",
    "dep:bitfun-services-integrations",
    "bitfun-services-integrations/remote-ssh",
]
tool-packs = ["dep:bitfun-tool-packs", "bitfun-tool-packs/product-full", "dep:image"]
# Deprecated compatibility feature. Tauri integration is desktop-owned now;
# keep the public feature name as a no-op for downstream manifests.
tauri-support = []
ssh-remote = [
    "remote-workspace",
    "bitfun-services-integrations/remote-ssh-concrete",
]

[dev-dependencies]
bitfun-runtime-services = { path = "../../execution/runtime-services", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "git_contracts"
required-features = ["git"]

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
