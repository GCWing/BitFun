<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoopX</title>
</head>
<body>
  <a class="skip-link" href="#log-list" data-i18n="skipToLogs">跳到日志</a>

  <div id="loopx-app" class="loopx-shell" aria-busy="true">
    <header class="intake-header" aria-labelledby="product-name">
      <div class="product-mark">
        <span class="product-mark__glyph" aria-hidden="true">LX</span>
        <div class="product-mark__copy">
          <strong id="product-name">LoopX</strong>
          <span id="connection-label" data-i18n="connecting">正在连接宿主</span>
        </div>
      </div>

      <form id="intake-form" class="intake-form" aria-label="创建 LoopX 修复任务">
        <label class="sr-only" for="intake-input" data-i18n="intakeLabel">GitHub Issue、Pull Request 或仓库链接</label>
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </span>
        <input
          id="intake-input"
          name="intake"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          maxlength="2048"
          required
          placeholder="https://github.com/owner/repo/issues/123"
          data-i18n-placeholder="intakePlaceholder"
        />
        <span class="model-field" title="模型" data-i18n-title="model">
          <span class="model-field__label" data-i18n="modelAuto">自动模型</span>
          <input id="model-select" name="model" type="hidden" value="auto" />
        </span>
        <button id="resolve-button" class="icon-button icon-button--accent" type="submit" title="分析链接" data-i18n-title="resolve">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14-7-7 14-2-7-5-2Z"/></svg>
          <span class="sr-only" data-i18n="resolve">分析链接</span>
        </button>
      </form>

      <button id="sync-button" class="icon-button" type="button" title="刷新状态" data-i18n-title="refresh">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
        <span class="sr-only" data-i18n="refresh">刷新状态</span>
      </button>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="unsupported-banner" class="unsupported-banner" role="alert" hidden>
      <span class="status-icon" aria-hidden="true">!</span>
      <div>
        <strong data-i18n="unsupportedTitle">当前执行位置不支持 LoopX</strong>
        <p id="unsupported-reason"></p>
      </div>
    </div>

    <details id="environment-panel" class="environment-panel">
      <summary>
        <span class="summary-title">
          <span id="environment-dot" class="status-dot" aria-hidden="true"></span>
          <span data-i18n="environment">环境</span>
          <strong id="environment-status">--</strong>
        </span>
        <span id="environment-checked" class="summary-meta"></span>
      </summary>
      <div class="environment-body">
        <section aria-labelledby="core-env-title">
          <div class="section-heading">
            <h2 id="core-env-title" data-i18n="coreEnvironment">核心环境</h2>
            <span data-i18n="required">必需</span>
          </div>
          <div id="core-environment-list" class="environment-grid"></div>
        </section>
        <section aria-labelledby="optional-env-title">
          <div class="section-heading">
            <h2 id="optional-env-title" data-i18n="optionalEnvironment">增强能力</h2>
            <span data-i18n="optional">可选</span>
          </div>
          <div id="optional-environment-list" class="environment-grid"></div>
        </section>
        <button id="retry-environment" class="text-button" type="button" data-i18n="retryEnvironment">重新检查环境</button>
      </div>
    </details>

    <div class="workbench">
      <aside id="task-rail" class="task-rail" aria-label="LoopX 任务列表">
        <div class="task-rail__header">
          <div>
            <h2 data-i18n="tasks">任务</h2>
            <span id="task-count" class="count-badge">0</span>
          </div>
          <button id="collapse-tasks" class="icon-button icon-button--small" type="button" aria-expanded="true" title="收起任务栏" data-i18n-title="collapseTasks">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span class="sr-only" data-i18n="collapseTasks">收起任务栏</span>
          </button>
        </div>
        <nav id="task-list" class="task-list" aria-label="LoopX 任务">
          <button id="all-activity" class="task-item task-item--all is-selected" type="button">
            <span class="task-item__icon" aria-hidden="true">#</span>
            <span class="task-item__main">
              <strong data-i18n="allActivity">全部活动</strong>
              <small id="all-activity-meta">0</small>
            </span>
          </button>
          <div id="task-items"></div>
        </nav>
        <div id="task-empty" class="task-empty">
          <span aria-hidden="true">#</span>
          <p data-i18n="noTasks">暂无任务</p>
        </div>
      </aside>

      <main class="log-workspace" aria-labelledby="log-title">
        <header class="log-header">
          <div class="log-title-block">
            <div class="log-title-row">
              <h1 id="log-title" data-i18n="activity">运行日志</h1>
              <span id="selected-state" class="state-pill" hidden></span>
            </div>
            <p id="selected-summary" data-i18n="allTaskEvents">所有任务的关键事件</p>
          </div>
          <div class="log-controls">
            <div class="segmented" role="radiogroup" aria-label="日志密度">
              <button id="mode-key" type="button" role="radio" aria-checked="true" class="is-active" data-i18n="keyEvents">关键事件</button>
              <button id="mode-full" type="button" role="radio" aria-checked="false" data-i18n="fullLog">完整日志</button>
            </div>
            <label class="search-field" for="log-search">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="log-search" type="search" autocomplete="off" placeholder="搜索日志" data-i18n-placeholder="searchLogs" />
            </label>
            <label class="toggle-field">
              <input id="errors-only" type="checkbox" />
              <span data-i18n="errorsOnly">仅错误</span>
            </label>
            <button id="export-logs" class="icon-button icon-button--small" type="button" title="导出日志" data-i18n-title="exportLogs">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              <span class="sr-only" data-i18n="exportLogs">导出日志</span>
            </button>
          </div>
        </header>

        <section id="liveness-panel" class="liveness-panel" aria-label="当前任务状态" hidden>
          <div class="liveness-primary">
            <span id="liveness-dot" class="status-dot" aria-hidden="true"></span>
            <strong id="liveness-phase">--</strong>
            <span id="liveness-since"></span>
          </div>
          <div class="liveness-details">
            <span id="liveness-turn" hidden></span>
            <span id="liveness-tool" hidden></span>
            <span id="liveness-deadline" hidden></span>
            <span id="liveness-error" class="error-text" hidden></span>
          </div>
          <div id="task-actions" class="task-actions"></div>
        </section>

        <div id="log-scroll" class="log-scroll">
          <div id="log-empty" class="log-empty">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h12M4 18h8"/></svg>
            <p data-i18n="noLogs">暂无运行事件</p>
          </div>
          <ol id="log-list" class="log-list" role="log" aria-live="off" aria-relevant="additions"></ol>
        </div>
        <button id="new-events" class="new-events" type="button" hidden data-i18n="newEvents">查看新事件</button>

        <footer class="stream-status">
          <span id="stream-state" data-i18n="notConnected">未连接</span>
          <span id="stream-cursor">--</span>
          <span id="visible-log-count">0</span>
        </footer>
      </main>
    </div>
  </div>

  <dialog id="intake-dialog" class="dialog dialog--wide" aria-labelledby="intake-dialog-title">
    <form id="intake-confirm-form" method="dialog">
      <header class="dialog__header">
        <div>
          <span class="eyebrow" data-i18n="confirmTask">确认任务</span>
          <h2 id="intake-dialog-title"></h2>
        </div>
        <button class="icon-button dialog-close" type="button" title="关闭" data-i18n-title="close">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          <span class="sr-only" data-i18n="close">关闭</span>
        </button>
      </header>
      <div class="dialog__body">
        <dl class="preview-facts">
          <div><dt data-i18n="repository">仓库</dt><dd id="preview-repository">--</dd></div>
          <div><dt data-i18n="workspace">工作区</dt><dd id="preview-workspace">--</dd></div>
          <div><dt data-i18n="model">模型</dt><dd id="preview-model">--</dd></div>
          <div><dt data-i18n="imageCapability">图片能力</dt><dd id="preview-images">--</dd></div>
        </dl>
        <section aria-labelledby="candidate-title">
          <div class="section-heading">
            <h3 id="candidate-title" data-i18n="items">Issue / PR</h3>
            <span id="candidate-count">0</span>
          </div>
          <div id="candidate-list" class="candidate-list"></div>
        </section>
        <section aria-labelledby="permission-title">
          <div class="section-heading">
            <h3 id="permission-title" data-i18n="permissions">本次权限</h3>
            <span data-i18n="explicitGrant">逐项授权</span>
          </div>
          <div id="permission-list" class="permission-list"></div>
        </section>
        <div id="intake-warning" class="dialog-warning" role="status" hidden></div>
      </div>
      <footer class="dialog__footer">
        <button class="text-button dialog-close" type="button" data-i18n="cancel">取消</button>
        <button id="create-button" class="primary-button" type="submit" data-i18n="createTasks">创建所选任务</button>
      </footer>
    </form>
  </dialog>

  <dialog id="retry-dialog" class="dialog" aria-labelledby="retry-dialog-title">
    <form method="dialog">
      <header class="dialog__header">
        <div>
          <span class="eyebrow" data-i18n="newAttempt">新尝试</span>
          <h2 id="retry-dialog-title" data-i18n="terminalExists">已有终态任务</h2>
        </div>
      </header>
      <div class="dialog__body">
        <p id="retry-message"></p>
      </div>
      <footer class="dialog__footer">
        <button id="retry-cancel" class="text-button" type="button" data-i18n="cancel">取消</button>
        <button id="retry-confirm" class="primary-button" type="submit" data-i18n="confirmNewAttempt">确认新尝试</button>
      </footer>
    </form>
  </dialog>

  <dialog id="gate-dialog" class="dialog" aria-labelledby="gate-dialog-title">
    <form id="gate-form" method="dialog">
      <header class="dialog__header">
        <div>
          <span class="eyebrow" data-i18n="approvalGate">审批门禁</span>
          <h2 id="gate-dialog-title"></h2>
        </div>
      </header>
      <div class="dialog__body">
        <p id="gate-message"></p>
        <label class="note-field" for="gate-note">
          <span data-i18n="approvalNote">审批备注</span>
          <textarea id="gate-note" rows="3" maxlength="1000" data-i18n-placeholder="approvalNotePlaceholder"></textarea>
        </label>
      </div>
      <footer class="dialog__footer dialog__footer--split">
        <button id="gate-cancel" class="text-button" type="button" data-i18n="cancel">取消</button>
        <div>
          <button id="gate-reject" class="danger-button" type="button" data-i18n="reject">拒绝</button>
          <button id="gate-approve" class="primary-button" type="submit" data-i18n="approve">批准</button>
        </div>
      </footer>
    </form>
  </dialog>

  <script src="ui.js"></script>
</body>
</html>
