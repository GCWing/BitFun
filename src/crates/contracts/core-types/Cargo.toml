[package]
name = "openbitfun-core-types"
version.workspace = true
edition.workspace = true
description = "OpenBitFun shared low-level product DTOs"
autotests = false

[lib]
name = "openbitfun_core_types"
crate-type = ["rlib"]

[[test]]
name = "core_type_contracts"
path = "tests/core_type_contracts.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
default = []
# Derive `ts_rs::TS` on the wire types so downstream crates (runtime-ports,
# app-server) can export TypeScript bindings for types that reference them.
# Orthogonal to the existing serde contract; pulls no extra integration
# dependency. Mirrors the `ts` feature in `openbitfun-product-domains`.
ts = ["dep:ts-rs"]

[lints]
workspace = true
