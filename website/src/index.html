<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="" />
    <meta name="description" content="__PAGE_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BitFun Playbook" />
    <meta property="og:title" content="__PAGE_TITLE__" />
    <meta property="og:description" content="__PAGE_DESCRIPTION__" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:image" content="https://playbook.openbitfun.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        let theme = 'system';
        try {
          const stored = localStorage.getItem('bitfun-playbook-theme');
          if (['light', 'dark'].includes(stored)) theme = stored;
        } catch {}
        const root = document.documentElement;
        const dark = theme === 'dark'
          || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.setAttribute('data-bf-design-system-root', '');
        root.dataset.theme = theme;
        root.dataset.colorScheme = dark ? 'dark' : 'light';
        root.dataset.contrast = 'standard';
        root.dataset.density = 'comfortable';
      })();
    </script>
    <link rel="canonical" href="__PAGE_URL__" />
    <link rel="icon" href="/assets/bitfun.png" />
    <link rel="stylesheet" href="/assets/design-tokens.css?v=__ASSET_VERSION__" />
    <link rel="stylesheet" href="/assets/theme.css?v=__ASSET_VERSION__" />
    <link rel="stylesheet" href="/assets/styles.css?v=__ASSET_VERSION__" />
    <title>__PAGE_TITLE__</title>
  </head>
  <body>
    <script id="page-data" type="application/json">__PAGE_DATA__</script>
    <div id="app">
      <div class="loading-shell" aria-live="polite">
        <span class="loading-mark">B</span>
        <span>Loading BitFun Playbook…</span>
      </div>
    </div>
    <script type="module" src="/assets/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
